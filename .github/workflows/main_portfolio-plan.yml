:::writing{variant="document" id="73184"}
name: Deploy static website to Azure Web App - portfolio-plan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DD36F3A5E8E64C758180972A408DE88A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_770F9DF8729243729F7F2E15C435F3B0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_137E79F51BAB4E49A737A4E43B41B830 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: portfolio-plan
          slot-name: Production
          package: .
:::
